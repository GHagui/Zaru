[package]
name = "zaru"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Keyboard-driven culling for Canon CR3 photos."

[build-dependencies]
tauri-build = "2"

[dependencies]
tauri = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Windows reports its language through the system, not the environment.
sys-locale = "0.3"
zaru-core = { path = "../crates/zaru-core" }

[[bin]]
name = "zaru"
path = "src/main.rs"
