[package]
name = "zaru-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Culling session state, preferences and preview prefetch, independent of any UI."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zaru-cr3 = { path = "../zaru-cr3", features = ["serde"] }
zaru-xmp = { path = "../zaru-xmp", features = ["serde"] }
