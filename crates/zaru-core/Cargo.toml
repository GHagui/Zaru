[package]
name = "zaru-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Culling session state, preferences and preview prefetch, independent of any UI."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zaru-cr3 = { path = "../zaru-cr3", features = ["serde"] }
# Scaling happens during the inverse DCT, so a thumbnail never materialises the
# full image. Rayon is off: this crate runs its own pool and two of them would
# just oversubscribe the machine.
jpeg-decoder = { version = "0.3", default-features = false }
jpeg-encoder = { version = "0.6", default-features = false }
zaru-xmp = { path = "../zaru-xmp", features = ["serde"] }
