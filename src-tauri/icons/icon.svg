<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Zaru</title>
  <rect width="256" height="256" rx="58" fill="#232323"/>
  <rect x="1" y="1" width="254" height="254" rx="57" fill="none" stroke="#3d3d3d" stroke-width="2"/>
  <!-- A zaru is a bamboo draining basket: what matters stays, the rest goes
       through. Seen at an angle so the rim reads as an opening — drawn flat,
       the rim and the bowl together read as a smiling mouth. -->
  <defs><clipPath id="zaru-bowl">
    <path d="M40 90A88 26 0 0 0 216 90A88 104 0 0 1 40 90Z"/>
  </clipPath></defs>
  <path d="M40 90A88 26 0 0 1 216 90" fill="none" stroke="#6e6e6e" stroke-width="15"/>
  <circle cx="128" cy="94" r="27" fill="#edcd79"/>
  <g clip-path="url(#zaru-bowl)" stroke="#8f8f8f" stroke-width="12" stroke-linecap="square">
    <path d="M84 92V210M172 92V210M20 146H236"/>
  </g>
  <path d="M40 90A88 104 0 0 0 216 90" fill="none" stroke="#ededed" stroke-width="16" stroke-linecap="round"/>
  <path d="M40 90A88 26 0 0 0 216 90" fill="none" stroke="#ededed" stroke-width="16" stroke-linecap="round"/>
</svg>
